name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: scrapewise
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./scrapewise[test]"
          python -m pytest scrapewise/tests -q

      # langchain-scrapewise depends on the client in this repo, so it is
      # installed from the local path rather than from PyPI.
      - name: langchain-scrapewise
        run: |
          python -m pip install -e "./langchain-scrapewise[test]"
          python -m pytest langchain-scrapewise/tests -q
